server:
  port: 8888
spring:
  application:
    name: spring-boot-rest-api
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

#    Deletado pois essas informações serão geradas dinâmicamente quando for construído a classe de config de testecontainers
#    url: jdbc:mysql://localhost:3306/my_first_database?useTimeZone=true&serverTimeZone=UTC
#    username: root
#    password: MyNewPass

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
      show-sql: false
    open-in-view: false

# O 'logging' deve ficar aqui, totalmente à esquerda!
logging:
  level:
    root: INFO
    br.com.oopisani: DEBUG

spring-doc:
  paths-to-match: /api/**/v1/**
  swagger-ui:
    use-root-path: true